<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F5B4A"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Kalkulator Waris KHI</title>
<style>
:root{--g:#0F5B4A;--bg:#FAF7F0;--tx:#1B1F1D;--mu:#5B635F;--bd:#E4DDCD;--gl:#E3F0EB}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{padding:16px 16px 8px}.st{font-size:12px;font-weight:600;color:var(--g)}h1{margin:4px 0 2px;font-size:24px}header p{margin:0;font-size:14px;color:var(--mu)}
.bk{border:0;background:none;font-size:22px;color:var(--g);min-height:44px;padding:0;margin-bottom:-6px}
main{flex:1;padding:8px 16px;display:flex;flex-direction:column;gap:12px}
footer{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:16px;font-weight:600}.btn:disabled{background:#9DB5AE}
.btn2{width:100%;min-height:48px;border:1px solid #C9C2B2;border-radius:12px;background:#fff;color:var(--tx);font-size:15px;font-weight:600}
.dash{min-height:52px;border:1px dashed var(--g);border-radius:12px;background:none;color:var(--g);font-size:15px;font-weight:600}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;color:inherit}
button.card{min-height:60px}.sub{font-size:13px;color:var(--mu)}.lk{font-size:13px;font-weight:600;color:var(--g)}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:48px;border-radius:12px;border:1px solid #C9C2B2;background:#fff;font-size:15px;font-weight:600;color:var(--tx)}.seg .on{background:var(--gl);border-color:var(--g);color:var(--g)}
.sp{display:flex;align-items:center;gap:12px}.sp b{min-width:18px;text-align:center;font-size:16px}.sp button{width:44px;height:44px;border-radius:22px;border:1px solid #C9C2B2;background:#fff;font-size:20px}.sp button+b+button{background:var(--g);color:#fff;border:0}
label{display:block;font-size:14px;font-weight:600}label span{display:block;font-size:13px;font-weight:400;color:var(--mu);margin:2px 0 6px}
input,select{width:100%;height:48px;padding:0 14px;border:1px solid #C9C2B2;border-radius:12px;background:#fff;font-size:16px;color:var(--tx)}
.tg{width:48px;height:28px;border-radius:14px;background:#C9C2B2;border:0;position:relative;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff}.tg.on{background:var(--g)}.tg.on::after{left:auto;right:3px}
.ov{position:fixed;inset:0;background:rgba(27,31,29,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.big{font-size:22px;font-weight:700;color:var(--g)}.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--g);background:var(--gl);border-radius:8px;padding:6px 10px;margin:8px 6px 0 0}
details{display:inline-block;max-width:100%}summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}.dl{font-size:13px;line-height:1.5;color:#3F4743;margin:6px 0 0}
.warn{background:#FCE9CF;color:#7A3E00;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.5}.note{font-size:13px;line-height:1.5;color:#3F4743}
</style></head><body><div id="app">Memuat…</div>
<script src="waris.js"></script>
<script>
const REL=[{t:'Anak',L:'anak_lk',P:'anak_pr',g:1},{t:'Cucu (anak dari anak)',L:'cucu_lk',P:'cucu_pr',g:1},{t:'Ayah',k:'ayah'},{t:'Ibu',k:'ibu'},{t:'Kakek (ayah dari ayah)',k:'kakek'},{t:'Nenek dari pihak ayah',k:'nenek_ayah'},{t:'Nenek dari pihak ibu',k:'nenek_ibu'},
{t:'Saudara kandung',L:'sdr_lk_kandung',P:'sdri_kandung',g:1},{t:'Saudara seayah',L:'sdr_lk_seayah',P:'sdri_seayah',g:1},{t:'Saudara seibu',L:'sdr_lk_seibu',P:'sdri_seibu',g:1},
{t:'Keponakan (anak saudara kandung)',k:'kemenakan_kandung'},{t:'Keponakan (anak saudara seayah)',k:'kemenakan_seayah'},{t:'Paman kandung',k:'paman_kandung'},{t:'Paman seayah',k:'paman_seayah'},{t:'Sepupu (anak paman kandung)',k:'sepupu_paman_kandung'},{t:'Sepupu (anak paman seayah)',k:'sepupu_paman_seayah'}];
const ONE=new Set(['ayah','ibu','kakek','nenek_ayah','nenek_ibu']);
const relKey=(r,g)=>REL[r].g?REL[r][g]:REL[r].k;
const relName=(r,g)=>REL[r].g?REL[r].t+(g==='L'?' laki-laki':' perempuan'):REL[r].t;
const S={step:0,jk:'L',nama:'',istri:1,suami:1,list:[],m:{bawaan:0,utang:0,jenazah:0,wasiat:0},b:[],musy:true,radd:true,pop:null,res:null,data:null,eng:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),fmt=n=>n?String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'';
const num=s=>Number(String(s).replace(/\D/g,'').slice(0,15))||0;
const head=(n,t,sub,back)=>`<header>${back?'<button class="bk" data-a="back" aria-label="Kembali">← Kembali</button>':''}<div class="st">LANGKAH ${n} DARI 4</div><h1>${t}</h1><p>${sub}</p></header>`;
const sp=(id,v)=>`<div class="sp"><button data-a="dec" data-id="${id}" aria-label="Kurangi">−</button><b>${v}</b><button data-a="inc" data-id="${id}" aria-label="Tambah">+</button></div>`;
const seg=(a,v,opts)=>`<div class="seg">${opts.map(([k,t])=>`<button data-a="${a}" data-v="${k}" class="${v===k?'on':''}">${t}</button>`).join('')}</div>`;
const tg=(a,on,aria)=>`<button class="tg ${on?'on':''}" data-a="${a}" role="switch" aria-checked="${on}" aria-label="${aria}"></button>`;
const fld=(id,l,h,v)=>`<label>${l}<span>${h}</span><input data-f="${id}" inputmode="numeric" placeholder="Rp 0" value="${v?'Rp '+fmt(v):''}"></label>`;
const KN={istri:'Istri',suami:'Suami'};REL.forEach(x=>{if(x.g){KN[x.L]=x.t+' laki-laki';KN[x.P]=x.t+' perempuan'}else KN[x.k]=x.t});
function blk(key){const W=S.eng.W,N={};for(const [k,n] of Object.entries(heirs()))if(n>0){const [a,l]=WarisJS.INPUT[k];N[n===1?a:l]=k}
 const pr=Object.keys(N).map(Number).sort((a,b)=>a-b),c=+Object.keys(N).find(x=>N[x]===key),bad=r=>{try{return W.pilih(r,pr).tipe==='mahjub'}catch(e){return false}};
 let ch;try{ch=W.pilih(c,pr)}catch(e){return 'ahli waris lain'}
 if(ch.tipe!=='mahjub')return 'ahli waris lain (tidak ada sisa harta untuk ashabah)';
 const g=r=>W.G.get(r+','+c)||{};let bl=pr.filter(r=>r>c&&(ch.r===-1?['M','j'].includes(g(r).marker):g(r).tipe==='mahjub'));
 const nb=bl.filter(r=>!bad(r));if(nb.length)bl=nb;
 return bl.length?bl.map(r=>KN[N[r]]).join(', '):'ahli waris lain'}
const tb=b=>b.pecahan==='0'&&b.jalur==='Pewaris'?`<div class="warn" style="margin-top:8px">Terhalang oleh: <b>${esc(blk(b.kunci))}</b></div>`:'';
function pas(r){const n=S.jk==='L'?S.istri:(S.suami?1:0);if(!n)return null;const bs=[];for(let i=0;i<n;i++)bs.push(S.b[i]||0);const tot=bs.reduce((a,x)=>a+x,0);if(!tot)return null;
 const w=r.bagian.find(x=>x.kunci===(S.jk==='L'?'istri':'suami')&&x.jalur==='Pewaris'),per=w?(w.rupiah||0)/n:0,T=S.jk==='L'?'Istri':'Suami';
 return{T,n,pec:w?w.pecahan:'0',rows:bs.map((x,i)=>({l:n>1?T+' '+(i+1):T,h:x/2,w:per,t:x/2+per})),tot:tot/2+per*n}}
function pasHtml(r){const p=pas(r);if(!p)return '';
 return `<div class="card"><b>${p.T} yang masih hidup: total bagian</b><p class="note" style="margin:4px 0 8px">Separuh harta bersama adalah hak pasangan (Pasal 96 KHI), bukan warisan. Ditambah bagian warisannya.</p>`+
 p.rows.map(x=>`<div style="padding:8px 0;border-top:1px solid var(--bd)">${p.n>1?`<b>${x.l}</b>`:''}<div class="row sub"><span>½ harta bersama</span><span>${rp(x.h)}</span></div><div class="row sub"><span>Warisan ${p.pec}${p.n>1?' dibagi '+p.n:''}</span><span>${rp(x.w)}</span></div><div class="row"><b>Total</b><span class="big" style="font-size:18px">${rp(x.t)}</span></div></div>`).join('')+
 (p.n>1?`<div class="row" style="border-top:1px solid var(--bd);padding-top:8px"><b>Total semua istri</b><span class="big" style="font-size:18px">${rp(p.tot)}</span></div>`:'')+'</div>'}
const spouseN=()=>S.jk==='L'?S.istri:S.suami;
function heirs(){const h={};if(S.jk==='L'&&S.istri)h.istri=S.istri;if(S.jk==='P'&&S.suami)h.suami=1;for(const it of S.list){const k=relKey(it.r,it.g);h[k]=(h[k]||0)+it.n}return h}
function view(){
 let h='',f='';
 if(S.step===0){
  h=head(1,'Siapa yang wafat?','Pewaris menentukan siapa saja ahli warisnya.');
  h+=`<main><div><label>Jenis kelamin pewaris<span></span></label>${seg('jk',S.jk,[['L','Laki-laki'],['P','Perempuan']])}</div>
  <label>Nama (boleh dikosongkan)<span></span><input data-f="nama" placeholder="Nama pewaris" value="${esc(S.nama)}"></label>
  ${S.jk==='L'?`<div class="card"><div class="row"><span><b>Istri yang masih hidup</b><br><span class="sub">Maksimal 4 (poligami)</span></span>${sp('istri',S.istri)}</div><p class="note">Bagian istri dibagi rata antar istri. Tiap pernikahan punya harta bersama sendiri.</p></div>`
  :`<div class="card"><div class="row"><span><b>Suami masih hidup</b></span>${tg('suami',S.suami,'Suami masih hidup')}</div></div>`}</main>`;
  f='<button class="btn" data-a="next">Lanjut: ahli waris</button>';
 }else if(S.step===1){
  h=head(2,'Ahli waris','Tambahkan keluarga yang masih hidup.',1)+'<main>';
  if(spouseN())h+=`<div class="card"><b>${S.jk==='L'?'Istri × '+S.istri:'Suami × 1'}</b><br><span class="sub">Dari data pewaris (ubah di langkah 1)</span></div>`;
  S.list.forEach((it,i)=>h+=`<button class="card row" data-a="edit" data-i="${i}"><span><b>${relName(it.r,it.g)} × ${it.n}</b>${it.ke?`<br><span class="sub">Dari Istri ${it.ke}</span>`:''}</span><span class="lk">Ubah</span></button>`);
  h+='<button class="dash" data-a="add">+ Tambah ahli waris</button></main>';
  f=`<button class="btn" data-a="next" ${Object.keys(heirs()).length?'':'disabled'}>Lanjut: harta</button>`;
 }else if(S.step===2){
  h=head(3,'Harta peninggalan','Boleh dikosongkan bila hanya ingin pecahan.',1)+'<main>'+fld('m.bawaan','Harta bawaan','Milik pewaris sebelum menikah atau warisan/hibah',S.m.bawaan);
  if(S.jk==='L')for(let i=0;i<S.istri;i++)h+=fld('b.'+i,'Harta bersama dengan Istri '+(i+1),'Dibagi dua dengan istri tersebut',S.b[i]||0);
  else if(S.suami)h+=fld('b.0','Harta bersama dengan suami','Dibagi dua dengan suami',S.b[0]||0);
  h+=fld('m.utang','Utang','Dikurangi sebelum dibagi',S.m.utang)+fld('m.jenazah','Biaya jenazah','Dikurangi sebelum dibagi',S.m.jenazah)+fld('m.wasiat','Wasiat','Maksimal 1/3 harta bersih (Pasal 195)',S.m.wasiat)
  +`<div class="card row"><span><b>Musytarakah</b><br><span class="sub">Saudara kandung ikut bagian seibu bila perlu (diperselisihkan)</span></span>${tg('musy',S.musy,'Musytarakah')}</div>
  <div class="card row"><span><b>Pasangan ikut radd</b><br><span class="sub">Sisa dibagi ulang termasuk suami/istri (Pasal 193)</span></span>${tg('radd',S.radd,'Pasangan ikut radd')}</div></main>`;
  f='<button class="btn" data-a="next">Hitung waris</button>';
 }else{
  const r=S.res;h=head(4,'Bagian tiap ahli waris','',1)+'<main>';
  if(r.status!=='ok')h+=`<div class="warn">${r.status==='tidak_didukung'?'Kasus ini belum didukung. Konsultasikan ke ahli faraidh atau Pengadilan Agama.':'Data belum sesuai.'}<br>${r.catatan.map(esc).join('<br>')}</div>`;
  else{
   const hasRp=r.bagian.some(b=>b.rupiah);
   for(const b of r.bagian){
    const ds=(b.dalil||[]).map(n=>{const d=S.data.tabel_viii.dalil.find(x=>String(x.no)===String(n));return d?`<details><summary class="chip">Dalil ${n}</summary><div class="dl">${esc(d.terjemah)}</div></details>`:`<span class="chip">${esc(n)}</span>`}).join('');
    h+=`<div class="card"><div class="row"><b>${esc(b.nama.replace(/\s*\(.*?\)/g,''))}${b.jumlah>1?' × '+b.jumlah:''}</b><span class="big">${b.pecahan}</span></div><div class="row sub"><span>${b.persen}%${b.jumlah>1?' untuk seluruhnya':''}</span><span>${hasRp?rp(b.rupiah||0):''}</span></div>${b.jumlah>1&&hasRp?`<div class="sub">± ${rp((b.rupiah||0)/b.jumlah)} per orang</div>`:''}${tb(b)}${ds}</div>`}
   h+=pasHtml(r);
   if(r.catatan.length)h+=`<div class="note"><b>Catatan</b><br>${r.catatan.map(esc).join('<br>')}</div>`;
   h+='<div class="note">Alat bantu hitung berdasarkan KHI dan metode praktis. Bukan fatwa atau putusan. Untuk keputusan akhir, tanyakan ke ahli faraidh atau Pengadilan Agama.</div>';
  }
  h+='</main>';f='<button class="btn2" data-a="copy" style="margin-bottom:8px">Salin hasil</button><button class="btn" data-a="reset">Mulai baru</button>';
 }
 if(S.pop)h+=popup();
 return h+(S.pop?'':`<footer>${f}</footer>`);
}
function popup(){
 const p=S.pop,R=REL[p.r],mx=ONE.has(relKey(p.r,p.g))?1:9;
 return `<div class="ov"><div class="sheet" role="dialog" aria-label="Tambah ahli waris"><b style="font-size:18px">${p.i<0?'Tambah':'Ubah'} ahli waris</b>
 <label>Hubungan dengan pewaris<span></span><select data-f="pop.r">${REL.map((x,i)=>`<option value="${i}" ${i===p.r?'selected':''}>${x.t}</option>`).join('')}</select></label>
 ${R.g?`<div><label>Jenis kelamin<span></span></label>${seg('pg',p.g,[['L','Laki-laki'],['P','Perempuan']])}</div>`:''}
 <div class="row"><b style="font-size:14px">Jumlah</b>${sp('pn',p.n)}</div>
 ${S.jk==='L'&&S.istri>1&&p.r===0?`<label>Dari istri ke-<span></span><select data-f="pop.ke">${Array.from({length:S.istri},(_,i)=>`<option value="${i+1}" ${p.ke===i+1?'selected':''}>Istri ${i+1}</option>`).join('')}</select></label>`:''}
 <button class="btn" data-a="save">Simpan</button>${p.i>=0?'<button class="btn2" data-a="del" style="color:#9B2C2C">Hapus</button>':''}<button class="btn2" data-a="cancel">Batal</button></div></div>`;
}
function hitung(){
 const bersama=S.jk==='L'?S.b.slice(0,S.istri):(S.suami?(S.b[0]||0):0);
 const k={pewaris:{jk:S.jk},ahli_waris:{heirs:heirs()},harta:{bawaan:S.m.bawaan,bersama,utang:S.m.utang,biaya_jenazah:S.m.jenazah,wasiat:S.m.wasiat},musytarikah:S.musy,radd_pasangan:S.radd};
 try{S.res=WarisJS.ringkas(S.eng.hitung(k))}catch(e){S.res={status:'error',catatan:['Terjadi kesalahan hitung: '+e.message],bagian:[]}}
}
function render(){const a=document.getElementById('app');a.innerHTML=view();window.scrollTo(0,0)}
function act(a,el){
 const id=el.dataset.id,v=el.dataset.v,P=S.pop;
 if(a==='jk'){S.jk=v;S.list=S.list.filter(x=>!(v==='P'&&x.ke))}
 else if(a==='suami')S.suami=S.suami?0:1;
 else if(a==='inc'||a==='dec'){const d=a==='inc'?1:-1;if(id==='istri')S.istri=Math.min(4,Math.max(0,S.istri+d));else if(id==='pn')P.n=Math.min(ONE.has(relKey(P.r,P.g))?1:9,Math.max(1,P.n+d))}
 else if(a==='next'){if(S.step===2)hitung();S.step++}
 else if(a==='back'||a==='reset'){if(a==='reset'){S.step=0;S.list=[];S.m={bawaan:0,utang:0,jenazah:0,wasiat:0};S.b=[];S.res=null}else S.step--}
 else if(a==='add')S.pop={i:-1,r:0,g:'L',n:1,ke:1};
 else if(a==='edit'){const it=S.list[+el.dataset.i];S.pop={...it,i:+el.dataset.i,ke:it.ke||1}}
 else if(a==='pg'){P.g=v}
 else if(a==='cancel')S.pop=null;
 else if(a==='del'){S.list.splice(P.i,1);S.pop=null}
 else if(a==='save'){const it={r:P.r,g:REL[P.r].g?P.g:'L',n:P.n,ke:(S.jk==='L'&&S.istri>1&&P.r===0)?P.ke:0};
  const key=relKey(it.r,it.g);if(P.i>=0)S.list.splice(P.i,1);
  const j=S.list.findIndex(x=>relKey(x.r,x.g)===key&&x.ke===it.ke);if(j>=0)S.list[j].n=Math.min(ONE.has(key)?1:99,S.list[j].n+it.n);else S.list.push(it);S.pop=null}
 else if(a==='musy')S.musy=!S.musy;else if(a==='radd')S.radd=!S.radd;
 else if(a==='copy'){const t=S.res.bagian.map(b=>b.nama.replace(/\s*\(.*?\)/g,'')+(b.jumlah>1?' x'+b.jumlah:'')+': '+b.pecahan+(b.rupiah?' ('+rp(b.rupiah)+')':'')).join('\n')+(()=>{const p=pas(S.res);return p?'\n\n'+p.T+' hidup, total: '+p.rows.map(x=>(p.n>1?x.l+' ':'')+'1/2 harta bersama '+rp(x.h)+' + warisan '+rp(x.w)+' = '+rp(x.t)).join('; '):''})()+'\n\nAlat bantu, bukan fatwa.';try{navigator.clipboard.writeText(t);el.textContent='Tersalin'}catch(e){}return}
 render();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&S.data)act(el.dataset.a,el)});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='nama')S.nama=e.target.value;else if(f[0]==='m')S.m[f.slice(2)]=num(e.target.value);else if(f[0]==='b')S.b[+f.slice(2)]=num(e.target.value);
 if(f[0]==='m'||f[0]==='b'){const n=num(e.target.value),t=n?'Rp '+fmt(n):'';e.target.value=t;try{e.target.setSelectionRange(t.length,t.length)}catch(_){}}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;
 if(f[0]==='m'||f[0]==='b'){e.target.value=num(e.target.value)?'Rp '+fmt(num(e.target.value)):''}
 else if(f==='pop.r'){S.pop.r=+e.target.value;S.pop.n=Math.min(S.pop.n,ONE.has(relKey(S.pop.r,S.pop.g))?1:9);render()}
 else if(f==='pop.ke')S.pop.ke=+e.target.value});
fetch('waris_faraidh.json').then(r=>r.json()).then(d=>{S.data=d;S.eng=new WarisJS.WarisLanjut(d);render()}).catch(()=>{document.getElementById('app').innerHTML='<p style="padding:16px">Data gagal dimuat. Buka lewat alamat http (bukan langsung dari berkas).</p>'});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
