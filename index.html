 if(a==='jk'){S.jk=v;S.spA=null;S.list=S.list.filter(x=>!(v==='P'&&x.ke))}
 else if(a==='suami'){S.suami=S.suami?0:1;if(!S.suami)S.spA=null}
 else if(a==='inc'||a==='dec'){const d=a==='inc'?1:-1;if(id==='istri'){if(d>0&&S.istri>=4)S.ntc='Istri maksimal 4.';S.istri=Math.min(4,Math.max(0,S.istri+d));if(S.istri<1)S.spA=null}else if(id==='pn')P.n=Math.min(ONE.has(relKey(P.r,P.g))?1:9,Math.max(1,P.n+d));else if(id==='kl')P.kt.lk=Math.min(9,Math.max(0,P.kt.lk+d));else if(id==='kp')P.kt.pr=Math.min(9,Math.max(0,P.kt.pr+d));else if(id.startsWith('s.')){const k=id.slice(2),m=SUBL(P.sp||relKey(P.r,P.g)).find(x=>x[0]===k)[2];P.sub[k]=Math.min(m,Math.max(0,(P.sub[k]||0)+d))}}
 else if(a==='askyes'){S.ask=null;S.pop={i:-1,r:0,g:'L',n:1,ke:1,st:'h',kt:{lk:1,pr:0},sub:{}}}else if(a==='askno'){S.askNo=sigA();S.ask=null;S.step++}else if(a==='ntcx')S.ntc='';else if(a==='rm'){S.baitul=v==='b';hitung()}else if(a==='next'){if(S.step===1){const s=sisaVal({pewaris:{jk:S.jk},ahli_waris:{heirs:heirs(),wafat_sebelum:wafatB(),wafat_sesudah:wafatA()},musytarikah:S.musy,radd_pasangan:S.radd});if(s&&S.askNo!==sigA()){S.ask=s;render();return}}if(S.step===2)hitung();S.step++}
 else if(a==='back'||a==='reset'){if(a==='reset'){S.step=0;S.list=[];S.spA=null;S.h2=null;S.m={bawaan:0,utang:0,jenazah:0,wasiat:0,bwp:0};S.b=[];S.res=null;S.baitul=false;S.askNo='';S.sisa=null}else S.step--}
 else if(a==='det')S.det=+el.dataset.i;else if(a==='detx')S.det=null;else if(a==='dl'){S.dl=el.dataset.n;S.dlc=el.dataset.c||''}else if(a==='dlx')S.dl=null;else if(a==='nop'){}else if(a==='ruj'){const rr=rjr(el.dataset.n);S.dl=null;S.page=1;S.anc=rr?rr.id:(el.dataset.n||'')}else if(a==='rujx')S.page=0;
 else if(a==='spedit'){S.pop={sp:S.jk==='L'?'istri':'suami',sub:{...(S.spA?S.spA.sub:{})}}}else if(a==='spsave'){const sub={};for(const [k,n] of Object.entries(P.sub||{}))if(n>0)sub[k]=n;if(!Object.keys(sub).length){P.err='Isi minimal satu ahli waris dari orang yang wafat ini.';render();return}S.spA={sub};S.pop=null}else if(a==='spdel'){S.spA=null;S.pop=null}else if(a==='add')S.pop={i:-1,r:0,g:'L',n:1,ke:1,st:'h',kt:{lk:1,pr:0},sub:{}};
 else if(a==='edit'){const it=S.list[+el.dataset.i];S.pop={...it,i:+el.dataset.i,ke:it.ke||1,st:it.st||'h',kt:{...(it.kt||{lk:1,pr:0})},sub:{...(it.sub||{})}}}
 else if(a==='pg'){P.g=v;P.sub={}}
 else if(a==='st'){P.st=v}
 else if(a==='cancel')S.pop=null;
 else if(a==='delx'){const it=S.list[+el.dataset.i];if(it&&confirm('Hapus '+relName(it.r,it.g)+'?'))S.list.splice(+el.dataset.i,1)}else if(a==='del'){S.list.splice(P.i,1);S.pop=null}
 else if(a==='save'){const st=P.st||'h',it={r:P.r,g:REL[P.r].g?P.g:'L',n:st==='h'?P.n:1,ke:(S.jk==='L'&&S.istri>1&&P.r===0)?P.ke:0,st};
  if(st==='a'){const sub={};for(const [k,n] of Object.entries(P.sub||{}))if(n>0)sub[k]=n;if(!Object.keys(sub).length){P.err='Isi minimal satu ahli waris dari orang yang wafat ini.';render();return}it.sub=sub}
  if(st==='b')it.kt={lk:P.kt.lk,pr:P.kt.pr};
  const key=relKey(it.r,it.g);if(P.i>=0)S.list.splice(P.i,1);
  const j=st==='h'?S.list.findIndex(x=>(x.st||'h')==='h'&&relKey(x.r,x.g)===key&&x.ke===it.ke):-1;if(j>=0)S.list[j].n=Math.min(ONE.has(key)?1:99,S.list[j].n+it.n);else S.list.push(it);S.pop=null}
 else if(a==='musy')S.musy=!S.musy;else if(a==='radd'){S.radd=!S.radd;if(S.step===3)hitung()}
 else if(a==='copy'){const t=S.res.bagian.map(b=>(b.jalur&&b.jalur!=='Pewaris'?'['+jl(b.jalur)+'] ':'')+nm(b.nama)+(b.jumlah>1?' x'+b.jumlah:'')+': '+(b.inner||b.pecahan)+(b.inner?' dari harta pasangan':'')+(b.rupiah?' ('+rp(b.rupiah)+')':'')).join('\n')+(()=>{const p=pas(S.res);return p?'\n\n'+p.T+' hidup, total: '+p.rows.map(x=>(p.n>1?x.l+' ':'')+'1/2 harta bersama '+rp(x.h)+' + warisan '+rp(x.w)+' = '+rp(x.t)).join('; '):''})()+'\n\nAlat bantu, bukan fatwa.';try{navigator.clipboard.writeText(t.replace(/\u00a0/g,' '));el.textContent='Tersalin'}catch(e){}return}
 render(a==='det'||a==='detx'||a==='rm'||a==='radd'||a==='dl'||a==='dlx'||a==='nop'||a==='rujx');if(S.page&&S.anc){const e=document.getElementById('r-'+S.anc);S.anc='';if(e)e.scrollIntoView()}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&S.data){if(el.dataset.a==='det'&&e.target.closest('details'))return;act(el.dataset.a,el)}});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='nama')S.nama=e.target.value;else if(f[0]==='m')S.m[f.slice(2)]=num(e.target.value);else if(f[0]==='b')S.b[+f.slice(2)]=num(e.target.value);
 if(f[0]==='m'||f[0]==='b'){const n=num(e.target.value),t=n?'Rp '+fmt(n):'';e.target.value=t;try{e.target.setSelectionRange(t.length,t.length)}catch(_){}}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;
 if(f[0]==='m'||f[0]==='b'){e.target.value=num(e.target.value)?'Rp '+fmt(num(e.target.value)):''}
 else if(f==='pop.r'){S.pop.r=+e.target.value;S.pop.n=Math.min(S.pop.n,ONE.has(relKey(S.pop.r,S.pop.g))?1:9);S.pop.sub={};if(!PGT.has(relKey(S.pop.r,S.pop.g))&&S.pop.st==='b')S.pop.st='h';render()}
 else if(f==='pop.ke')S.pop.ke=+e.target.value});
fetch('waris_faraidh.json').then(r=>r.json()).then(d=>{S.data=d;S.eng=new WarisJS.WarisLanjut(d);render();fetch('rujukan.json').then(r=>r.json()).then(j=>{S.rj=j;render(true)}).catch(()=>{})}).catch(()=>{document.getElementById('app').innerHTML='<p style="padding:16px">Data gagal dimuat. Buka lewat alamat http (bukan langsung dari berkas).</p>'});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
