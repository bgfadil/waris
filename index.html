</style></head><body><div id="app">Memuat…</div>
<script src="waris.js"></script>
<script>
const REL=[{t:'Anak',L:'anak_lk',P:'anak_pr',g:1},{t:'Cucu (anak dari anak)',L:'cucu_lk',P:'cucu_pr',g:1},{t:'Ayah',k:'ayah'},{t:'Ibu',k:'ibu'},{t:'Kakek (ayah dari ayah)',k:'kakek'},{t:'Nenek dari pihak ayah',k:'nenek_ayah'},{t:'Nenek dari pihak ibu',k:'nenek_ibu'},
{t:'Saudara kandung',L:'sdr_lk_kandung',P:'sdri_kandung',g:1},{t:'Saudara seayah',L:'sdr_lk_seayah',P:'sdri_seayah',g:1},{t:'Saudara seibu',L:'sdr_lk_seibu',P:'sdri_seibu',g:1},
{t:'Keponakan (anak saudara kandung)',k:'kemenakan_kandung'},{t:'Keponakan (anak saudara seayah)',k:'kemenakan_seayah'},{t:'Paman kandung',k:'paman_kandung'},{t:'Paman seayah',k:'paman_seayah'},{t:'Sepupu (anak paman kandung)',k:'sepupu_paman_kandung'},{t:'Sepupu (anak paman seayah)',k:'sepupu_paman_seayah'}];
const ONE=new Set(['ayah','ibu','kakek','nenek_ayah','nenek_ibu']);
const relKey=(r,g)=>REL[r].g?REL[r][g]:REL[r].k;
const relName=(r,g)=>REL[r].g?REL[r].t+(g==='L'?' laki-laki':' perempuan'):REL[r].t;
const S={step:0,jk:'L',nama:'',istri:1,suami:1,list:[],m:{bawaan:0,utang:0,jenazah:0,wasiat:0},b:[],musy:true,radd:true,pop:null,res:null,det:null,harta:null,data:null,eng:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),fmt=n=>n?String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'';
const num=s=>Number(String(s).replace(/\D/g,'').slice(0,15))||0;
const head=(n,t,sub,back)=>`<header>${back?'<button class="bk" data-a="back" aria-label="Kembali">← Kembali</button>':''}<div class="st">LANGKAH ${n} DARI 4</div><h1>${t}</h1><p>${sub}</p></header>`;
const sp=(id,v)=>`<div class="sp"><button data-a="dec" data-id="${id}" aria-label="Kurangi">−</button><b>${v}</b><button data-a="inc" data-id="${id}" aria-label="Tambah">+</button></div>`;
const seg=(a,v,opts)=>`<div class="seg">${opts.map(([k,t])=>`<button data-a="${a}" data-v="${k}" class="${v===k?'on':''}">${t}</button>`).join('')}</div>`;
const tg=(a,on,aria)=>`<button class="tg ${on?'on':''}" data-a="${a}" role="switch" aria-checked="${on}" aria-label="${aria}"></button>`;
const fld=(id,l,h,v)=>`<label>${l}<span>${h}</span><input data-f="${id}" inputmode="numeric" placeholder="Rp 0" value="${v?'Rp '+fmt(v):''}"></label>`;
const KN={istri:'Istri',suami:'Suami'};REL.forEach(x=>{if(x.g){KN[x.L]=x.t+' laki-laki';KN[x.P]=x.t+' perempuan'}else KN[x.k]=x.t});
function blk(key){const W=S.eng.W,N={};for(const [k,n] of Object.entries(heirsComb()))if(n>0){const [a,l]=WarisJS.INPUT[k];N[n===1?a:l]=k}
 const pr=Object.keys(N).map(Number).sort((a,b)=>a-b),c=+Object.keys(N).find(x=>N[x]===key),bad=r=>{try{return W.pilih(r,pr).tipe==='mahjub'}catch(e){return false}};
 let ch;try{ch=W.pilih(c,pr)}catch(e){return 'ahli waris lain'}
 if(ch.tipe!=='mahjub')return 'ahli waris lain (tidak ada sisa harta untuk ashabah)';
 const g=r=>W.G.get(r+','+c)||{};let bl=pr.filter(r=>r>c&&(ch.r===-1?['M','j'].includes(g(r).marker):g(r).tipe==='mahjub'));
 const nb=bl.filter(r=>!bad(r));if(nb.length)bl=nb;
 return bl.length?bl.map(r=>KN[N[r]]).join(', '):'ahli waris lain'}
const tb=b=>b.pecahan==='0'&&b.jalur==='Pewaris'?`<div class="warn" style="margin-top:8px">Terhalang oleh: <b>${esc(blk(b.kunci))}</b></div>`:'';
function pas(r){const n=S.jk==='L'?S.istri:(S.suami?1:0);if(!n)return null;const bs=[];for(let i=0;i<n;i++)bs.push(S.b[i]||0);const tot=bs.reduce((a,x)=>a+x,0);if(!tot)return null;
 const w=r.bagian.find(x=>x.kunci===(S.jk==='L'?'istri':'suami')&&x.jalur==='Pewaris'),per=w?(w.rupiah||0)/n:0,T=S.jk==='L'?'Istri':'Suami';
 return{T,n,pec:w?w.pecahan:'0',rows:bs.map((x,i)=>({l:n>1?T+' '+(i+1):T,h:x/2,w:per,t:x/2+per})),tot:tot/2+per*n}}
function pasHtml(r){const p=pas(r);if(!p)return '';
 return `<div class="card"><b>${p.T} yang masih hidup: total bagian</b><p class="note" style="margin:4px 0 8px">Separuh harta bersama adalah hak pasangan (Pasal 96 KHI), bukan warisan. Ditambah bagian warisannya.</p>`+
 p.rows.map(x=>`<div style="padding:8px 0;border-top:1px solid var(--bd)">${p.n>1?`<b>${x.l}</b>`:''}<div class="row sub"><span>½ harta bersama</span><span>${rp(x.h)}</span></div><div class="row sub"><span>Warisan ${p.pec}${p.n>1?' dibagi '+p.n:''}</span><span>${rp(x.w)}</span></div><div class="row"><b>Total</b><span class="big" style="font-size:18px">${rp(x.t)}</span></div></div>`).join('')+
 (p.n>1?`<div class="row" style="border-top:1px solid var(--bd);padding-top:8px"><b>Total semua istri</b><span class="big" style="font-size:18px">${rp(p.tot)}</span></div>`:'')+'</div>'}
const spouseN=()=>S.jk==='L'?S.istri:S.suami;
function heirs(){const h={};if(S.jk==='L'&&S.istri)h.istri=S.istri;if(S.jk==='P'&&S.suami)h.suami=1;for(const it of S.list){if((it.st||'h')!=='h')continue;const k=relKey(it.r,it.g);h[k]=(h[k]||0)+it.n}return h}
const FEM=new Set(['anak_pr','cucu_pr','ibu','nenek_ayah','nenek_ibu','sdri_kandung','sdri_seayah','sdri_seibu']),PGT=new Set(['anak_lk','anak_pr','cucu_lk','cucu_pr']);
const SUBL=k=>[FEM.has(k)?['suami','Suami',1]:['istri','Istri',4],['anak_lk','Anak laki-laki',9],['anak_pr','Anak perempuan',9],['cucu_lk','Cucu laki-laki (anak dari anak)',9],['cucu_pr','Cucu perempuan (anak dari anak)',9],['ayah','Ayah',1],['ibu','Ibu',1],['sdr_lk_kandung','Saudara kandung laki-laki',9],['sdri_kandung','Saudara kandung perempuan',9]];
const wafatB=()=>S.list.filter(it=>it.st==='b').map(it=>({key:relKey(it.r,it.g),keturunan:{lk:it.kt.lk,pr:it.kt.pr}}));
const wafatA=()=>S.list.filter(it=>it.st==='a').map(it=>({key:relKey(it.r,it.g),node:{heirs:{...it.sub}}}));
function heirsComb(){const h=heirs();for(const x of wafatA())h[x.key]=(h[x.key]||0)+1;for(const x of wafatB())if(x.keturunan.lk+x.keturunan.pr>0)h[x.key]=(h[x.key]||0)+1;return h}
const jl=j=>j.replace(/ \(\d+ orang\)/g,'').replace(/^Pewaris > /,'');
const nm=t=>t.replace(/\s*\(.*?\)/g,'').replace(/Kemenakan/g,'Keponakan');
const stp=(id,l,v)=>`<div class="row"><span style="font-size:14px">${l}</span>${sp(id,v)}</div>`;
const sub1=it=>{const st=it.st||'h';if(st==='b')return `Wafat sebelum pewaris · keturunan: ${it.kt.lk} laki-laki, ${it.kt.pr} perempuan`;if(st==='a')return 'Wafat sesudah pewaris · ahli waris: '+Object.entries(it.sub).map(([k,n])=>KN[k]+' × '+n).join(', ');return it.ke?'Dari Istri '+it.ke:''};
const fv=s=>{const m=/^(\d+)\/(\d+)$/.exec(String(s));return m?+m[1]/+m[2]:null};
const dalilHtml=b=>(b.dalil||[]).map(n=>{const d=S.data.tabel_viii.dalil.find(x=>String(x.no)===String(n));return d?`<details><summary class="chip">Dalil ${n}</summary><div class="dl">${esc(d.terjemah)}</div></details>`:`<span class="chip">${esc(n)}</span>`}).join('');
function asal(b){const t=String(b.hasil_baku||'');
 if(b.pecahan==='0')return 'Terhalang (mahjub): tidak mendapat bagian dalam kasus ini.';
 if(t==='pengganti')return 'Menggantikan orang tuanya yang wafat sebelum pewaris (Pasal 185 KHI). Laki-laki mendapat 2 kali bagian perempuan.';
 if(t==='Akdariyah')return 'Masalah Akdariyah (Tabel II): pembagian khusus dengan asal masalah 27.';
 if(fv(t)!==null){let x='Bagian tetap (furudh) menurut Tabel III: '+t+'.';if(b.jalur==='Pewaris'&&Math.abs(fv(t)-fv(b.pecahan))>1e-9)x+=' Bagian akhir '+b.pecahan+' berbeda karena penyesuaian pada kasus ini (misalnya ’aul, radd, atau musytarakah). Lihat Catatan di halaman hasil.';return x}
 if(['A','As','Λ','Λs'].includes(t))return 'Ashabah: menerima sisa harta setelah bagian tetap dibagikan.';
 return 'Kode di Tabel III: '+t+'.'}
function induk(b){if(!b.jalur||!b.jalur.includes(' > '))return '';
 let x=`<div class="note" style="margin-top:6px"><b>Jalur:</b> ${esc(jl(b.jalur))}</div>`;
 const ks=S.list.filter(y=>y.st==='a'||y.st==='b').map(y=>relKey(y.r,y.g));if(new Set(ks).size!==ks.length)return x;
 const F=WarisJS.Fr;let tot=F.of(0);S.res.bagian.filter(y=>y.jalur===b.jalur).forEach(y=>{tot=tot.add(F.of(y.pecahan))});
 if(tot.eq(0))return x;const inner=F.of(b.pecahan).div(tot);
 return x+`<div class="note" style="margin-top:6px">Orang yang wafat menerima total <b>${tot}</b> dari harta. Dari bagian itu, ${esc(nm(b.nama))} mendapat <b>${inner}</b>: ${inner} × ${tot} = ${b.pecahan}.</div>`}
function detSheet(){
 const r=S.res,b=r.bagian[S.det];if(!b)return '';
 const H=S.harta,hasRp=!!b.rupiah,D=H?H.dibagi:0;
 const ln=(l,v,bd)=>`<div class="row${bd?'':' sub'}" style="padding:3px 0"><span>${l}</span><span>${bd?'<b>'+v+'</b>':v}</span></div>`;
 const sec=(t,x)=>`<div class="card" style="padding:12px 14px"><b>${t}</b><div style="margin-top:6px">${x}</div></div>`;
 let h=`<div class="ov"><div class="sheet" role="dialog" aria-label="Rincian hitungan">`;
 h+=`<div class="row"><b style="font-size:18px">${esc(nm(b.nama))}${b.jumlah>1?' × '+b.jumlah:''}</b><button class="btn2" data-a="detx" style="width:auto;padding:0 16px;min-height:40px">Tutup</button></div>`;
 h+=`<div class="row"><span class="sub">${b.persen}% dari harta yang dibagi</span><span class="big">${b.pecahan}</span></div>`;
 h+=sec('Asal bagian',`<div class="note">${esc(asal(b))}</div>${induk(b)}${tb(b)}${dalilHtml(b)}`);
 if(hasRp){let x=ln('Harta yang dibagi',rp(D))+ln(`${b.pecahan} × ${rp(D)}`,rp(b.rupiah),1);
  if(b.jumlah>1)x+=ln(`Dibagi ${b.jumlah} orang`,'± '+rp(b.rupiah/b.jumlah));
  x+='<div class="sub" style="margin-top:4px">Nominal dibulatkan ke rupiah penuh.</div>';h+=sec('Hitungan rupiah',x)}
 else h+=sec('Hitungan rupiah','<div class="note">Isi harta di langkah 3 untuk melihat nominal.</div>');
 if(b.jalur==='Pewaris'&&(b.kunci==='istri'||b.kunci==='suami')){const p=pas(r);
  if(p)h+=sec(p.T+' hidup: total',`<div class="note" style="margin-bottom:6px">Selain warisan, pasangan hidup berhak ½ harta bersama (Pasal 96 KHI).</div>`+p.rows.map(x=>(p.n>1?`<b>${x.l}</b>`:'')+ln('½ harta bersama',rp(x.h))+ln('Warisan',rp(x.w))+ln('Total',rp(x.t),1)).join('<div style="height:8px"></div>'))}
 if(hasRp&&H){const bw=S.m.bawaan||0,bs=Math.max(0,H.tirkah-bw+H.milik);let x='';
  if(bw)x+=ln('Harta bawaan',rp(bw));if(bs)x+=ln('Harta bersama',rp(bs));if(H.milik)x+=ln('− ½ hak pasangan hidup','− '+rp(H.milik));
  x+=ln('Harta peninggalan',rp(H.tirkah),1);
  if(S.m.utang)x+=ln('− Utang','− '+rp(S.m.utang));if(S.m.jenazah)x+=ln('− Biaya jenazah','− '+rp(S.m.jenazah));if(H.wasiat)x+=ln('− Wasiat','− '+rp(H.wasiat));
  x+=ln('Harta yang dibagi ke ahli waris',rp(H.dibagi),1);h+=sec('Asal harta yang dibagi',x)}
 return h+`<button class="btn" data-a="detx">Tutup</button></div></div>`}
function view(){
 let h='',f='';
 if(S.step===0){
  h=head(1,'Siapa yang wafat?','Pewaris menentukan siapa saja ahli warisnya.');
  h+=`<main><div><label>Jenis kelamin pewaris<span></span></label>${seg('jk',S.jk,[['L','Laki-laki'],['P','Perempuan']])}</div>
  <label>Nama (boleh dikosongkan)<span></span><input data-f="nama" placeholder="Nama pewaris" value="${esc(S.nama)}"></label>
  ${S.jk==='L'?`<div class="card"><div class="row"><span><b>Istri yang masih hidup</b><br><span class="sub">Maksimal 4 (poligami)</span></span>${sp('istri',S.istri)}</div><p class="note">Bagian istri dibagi rata antar istri. Tiap pernikahan punya harta bersama sendiri.</p></div>`
  :`<div class="card"><div class="row"><span><b>Suami masih hidup</b></span>${tg('suami',S.suami,'Suami masih hidup')}</div></div>`}</main>`;
  f='<button class="btn" data-a="next">Lanjut: ahli waris</button>';
 }else if(S.step===1){
  h=head(2,'Ahli waris','Tambahkan keluarga: yang masih hidup maupun yang sudah wafat.',1)+'<main>';
  if(spouseN())h+=`<div class="card"><b>${S.jk==='L'?'Istri × '+S.istri:'Suami × 1'}</b><br><span class="sub">Dari data pewaris (ubah di langkah 1)</span></div>`;
  S.list.forEach((it,i)=>h+=`<button class="card row" data-a="edit" data-i="${i}"><span><b>${relName(it.r,it.g)}${(it.st||'h')==='h'?' × '+it.n:''}</b>${sub1(it)?`<br><span class="sub">${esc(sub1(it))}</span>`:''}</span><span class="lk">Ubah</span></button>`);
  h+='<button class="dash" data-a="add">+ Tambah ahli waris</button></main>';
  f=`<button class="btn" data-a="next" ${S.list.length||Object.keys(heirs()).length?'':'disabled'}>Lanjut: harta</button>`;
 }else if(S.step===2){
  h=head(3,'Harta peninggalan','Boleh dikosongkan bila hanya ingin pecahan.',1)+'<main>'+fld('m.bawaan','Harta bawaan','Milik pewaris sebelum menikah atau warisan/hibah',S.m.bawaan);
  if(S.jk==='L')for(let i=0;i<S.istri;i++)h+=fld('b.'+i,'Harta bersama dengan Istri '+(i+1),'Dibagi dua dengan istri tersebut',S.b[i]||0);
  else if(S.suami)h+=fld('b.0','Harta bersama dengan suami','Dibagi dua dengan suami',S.b[0]||0);
  h+=fld('m.utang','Utang','Dikurangi sebelum dibagi',S.m.utang)+fld('m.jenazah','Biaya jenazah','Dikurangi sebelum dibagi',S.m.jenazah)+fld('m.wasiat','Wasiat','Maksimal 1/3 harta bersih (Pasal 195)',S.m.wasiat)
  +`<div class="card row"><span><b>Musytarakah</b><br><span class="sub">Saudara kandung ikut bagian seibu bila perlu (diperselisihkan)</span></span>${tg('musy',S.musy,'Musytarakah')}</div>
  <div class="card row"><span><b>Pasangan ikut radd</b><br><span class="sub">Sisa dibagi ulang termasuk suami/istri (Pasal 193)</span></span>${tg('radd',S.radd,'Pasangan ikut radd')}</div></main>`;
  f='<button class="btn" data-a="next">Hitung waris</button>';
 }else{
  const r=S.res;h=head(4,'Bagian tiap ahli waris','Ketuk kartu mana saja untuk melihat rincian hitungannya.',1)+'<main>';
  if(r.status!=='ok')h+=`<div class="warn">${r.status==='tidak_didukung'?'Kasus ini belum didukung. Konsultasikan ke ahli faraidh atau Pengadilan Agama.':'Data belum sesuai.'}<br>${r.catatan.map(esc).join('<br>')}</div>`;
  else{
   const hasRp=r.bagian.some(b=>b.rupiah);
   for(const [bi,b] of r.bagian.entries()){
    const ds=(b.dalil||[]).map(n=>{const d=S.data.tabel_viii.dalil.find(x=>String(x.no)===String(n));return d?`<details><summary class="chip">Dalil ${n}</summary><div class="dl">${esc(d.terjemah)}</div></details>`:`<span class="chip">${esc(n)}</span>`}).join('');
    h+=`<div class="card tap" data-a="det" data-i="${bi}">${b.jalur&&b.jalur!=='Pewaris'?`<div class="sub" style="margin-bottom:4px">${esc(jl(b.jalur))}</div>`:''}<div class="row"><b>${esc(nm(b.nama))}${b.jumlah>1?' × '+b.jumlah:''}</b><span class="big">${b.pecahan}</span></div><div class="row sub"><span>${b.persen}%${b.jumlah>1?' untuk seluruhnya':''}</span><span>${hasRp?rp(b.rupiah||0):''}</span></div>${b.jumlah>1&&hasRp?`<div class="sub">± ${rp((b.rupiah||0)/b.jumlah)} per orang</div>`:''}${tb(b)}${ds}<div class="lk" style="margin-top:8px">Rincian hitungan ›</div></div>`}
   h+=pasHtml(r);
   if(r.catatan.length)h+=`<div class="note"><b>Catatan</b><br>${r.catatan.map(esc).join('<br>')}</div>`;
   h+='<div class="note">Alat bantu hitung berdasarkan KHI dan metode praktis. Bukan fatwa atau putusan. Untuk keputusan akhir, tanyakan ke ahli faraidh atau Pengadilan Agama.</div>';
  }
  h+='</main>';f='<button class="btn2" data-a="copy" style="margin-bottom:8px">Salin hasil</button><button class="btn" data-a="reset">Mulai baru</button>';
 }
 if(S.pop)h+=popup();
 if(S.det!==null&&S.res&&S.step===3)h+=detSheet();
 return h+(S.pop||S.det!==null?'':`<footer>${f}</footer>`);
}
function popup(){
 const p=S.pop,R=REL[p.r],key=relKey(p.r,p.g),st=p.st||'h',canB=PGT.has(key);
 const opts=[['h','Hidup']].concat(canB?[['b','Wafat sebelum']]:[]).concat([['a','Wafat sesudah']]);
 return `<div class="ov"><div class="sheet" role="dialog" aria-label="Tambah ahli waris"><b style="font-size:18px">${p.i<0?'Tambah':'Ubah'} ahli waris</b>
 <label>Hubungan dengan pewaris<span></span><select data-f="pop.r">${REL.map((x,i)=>`<option value="${i}" ${i===p.r?'selected':''}>${x.t}</option>`).join('')}</select></label>
 ${R.g?`<div><label>Jenis kelamin<span></span></label>${seg('pg',p.g,[['L','Laki-laki'],['P','Perempuan']])}</div>`:''}
 <div><label>Status<span></span></label>${seg('st',st,opts)}</div>
 ${st==='h'?`<div class="row"><b style="font-size:14px">Jumlah</b>${sp('pn',p.n)}</div>`:''}
 ${st==='b'?`<div class="note">Wafat sebelum pewaris: keturunannya menggantikan (Pasal 185 KHI), laki-laki 2 : perempuan 1.</div>${stp('kl','Keturunan laki-laki',p.kt.lk)}${stp('kp','Keturunan perempuan',p.kt.pr)}`:''}
 ${st==='a'?`<div class="note">Wafat sesudah pewaris: ia tetap dapat bagian, lalu bagiannya diwariskan ke ahli warisnya sendiri. Isi ahli warisnya:</div>`+SUBL(key).map(([k,l,m])=>stp('s.'+k,l,p.sub[k]||0)).join(''):''}
 ${S.jk==='L'&&S.istri>1&&p.r===0?`<label>Dari istri ke-<span></span><select data-f="pop.ke">${Array.from({length:S.istri},(_,i)=>`<option value="${i+1}" ${p.ke===i+1?'selected':''}>Istri ${i+1}</option>`).join('')}</select></label>`:''}
 ${p.err?`<div class="warn">${esc(p.err)}</div>`:''}
 <button class="btn" data-a="save">Simpan</button>${p.i>=0?'<button class="btn2" data-a="del" style="color:#9B2C2C">Hapus</button>':''}<button class="btn2" data-a="cancel">Batal</button></div></div>`;
}
function hitung(){
 const bersama=S.jk==='L'?S.b.slice(0,S.istri):(S.suami?(S.b[0]||0):0);
 const k={pewaris:{jk:S.jk},ahli_waris:{heirs:heirs(),wafat_sebelum:wafatB(),wafat_sesudah:wafatA()},harta:{bawaan:S.m.bawaan,bersama,utang:S.m.utang,biaya_jenazah:S.m.jenazah,wasiat:S.m.wasiat},musytarikah:S.musy,radd_pasangan:S.radd};
 try{const raw=S.eng.hitung(k);S.res=WarisJS.ringkas(raw);const hh=raw.harta;S.harta=hh?{tirkah:hh.tirkah.num(),bersih:hh.bersih.num(),wasiat:hh.wasiat.num(),dibagi:hh.dibagi.num(),milik:hh.milik_pasangan.num()}:null}catch(e){S.res={status:'error',catatan:['Terjadi kesalahan hitung: '+e.message],bagian:[]}}
}
function render(keep){const a=document.getElementById('app'),y=window.scrollY;a.innerHTML=view();window.scrollTo(0,keep?y:0)}
function act(a,el){
 const id=el.dataset.id,v=el.dataset.v,P=S.pop;if(P&&a!=='save')P.err='';if(a==='reset'||a==='back'||a==='next')S.det=null;
 if(a==='jk'){S.jk=v;S.list=S.list.filter(x=>!(v==='P'&&x.ke))}
 else if(a==='suami')S.suami=S.suami?0:1;
 else if(a==='inc'||a==='dec'){const d=a==='inc'?1:-1;if(id==='istri')S.istri=Math.min(4,Math.max(0,S.istri+d));else if(id==='pn')P.n=Math.min(ONE.has(relKey(P.r,P.g))?1:9,Math.max(1,P.n+d));else if(id==='kl')P.kt.lk=Math.min(9,Math.max(0,P.kt.lk+d));else if(id==='kp')P.kt.pr=Math.min(9,Math.max(0,P.kt.pr+d));else if(id.startsWith('s.')){const k=id.slice(2),m=SUBL(relKey(P.r,P.g)).find(x=>x[0]===k)[2];P.sub[k]=Math.min(m,Math.max(0,(P.sub[k]||0)+d))}}
 else if(a==='next'){if(S.step===2)hitung();S.step++}
 else if(a==='back'||a==='reset'){if(a==='reset'){S.step=0;S.list=[];S.m={bawaan:0,utang:0,jenazah:0,wasiat:0};S.b=[];S.res=null}else S.step--}
 else if(a==='det')S.det=+el.dataset.i;else if(a==='detx')S.det=null;
 else if(a==='add')S.pop={i:-1,r:0,g:'L',n:1,ke:1,st:'h',kt:{lk:1,pr:0},sub:{}};
 else if(a==='edit'){const it=S.list[+el.dataset.i];S.pop={...it,i:+el.dataset.i,ke:it.ke||1,st:it.st||'h',kt:{...(it.kt||{lk:1,pr:0})},sub:{...(it.sub||{})}}}
 else if(a==='pg'){P.g=v;P.sub={}}
 else if(a==='st'){P.st=v}
 else if(a==='cancel')S.pop=null;
 else if(a==='del'){S.list.splice(P.i,1);S.pop=null}
 else if(a==='save'){const st=P.st||'h',it={r:P.r,g:REL[P.r].g?P.g:'L',n:st==='h'?P.n:1,ke:(S.jk==='L'&&S.istri>1&&P.r===0)?P.ke:0,st};
  if(st==='a'){const sub={};for(const [k,n] of Object.entries(P.sub||{}))if(n>0)sub[k]=n;if(!Object.keys(sub).length){P.err='Isi minimal satu ahli waris dari orang yang wafat ini.';render();return}it.sub=sub}
  if(st==='b')it.kt={lk:P.kt.lk,pr:P.kt.pr};
  const key=relKey(it.r,it.g);if(P.i>=0)S.list.splice(P.i,1);
  const j=st==='h'?S.list.findIndex(x=>(x.st||'h')==='h'&&relKey(x.r,x.g)===key&&x.ke===it.ke):-1;if(j>=0)S.list[j].n=Math.min(ONE.has(key)?1:99,S.list[j].n+it.n);else S.list.push(it);S.pop=null}
 else if(a==='musy')S.musy=!S.musy;else if(a==='radd')S.radd=!S.radd;
 else if(a==='copy'){const t=S.res.bagian.map(b=>(b.jalur&&b.jalur!=='Pewaris'?'['+jl(b.jalur)+'] ':'')+nm(b.nama)+(b.jumlah>1?' x'+b.jumlah:'')+': '+b.pecahan+(b.rupiah?' ('+rp(b.rupiah)+')':'')).join('\n')+(()=>{const p=pas(S.res);return p?'\n\n'+p.T+' hidup, total: '+p.rows.map(x=>(p.n>1?x.l+' ':'')+'1/2 harta bersama '+rp(x.h)+' + warisan '+rp(x.w)+' = '+rp(x.t)).join('; '):''})()+'\n\nAlat bantu, bukan fatwa.';try{navigator.clipboard.writeText(t);el.textContent='Tersalin'}catch(e){}return}
 render(a==='det'||a==='detx');
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&S.data){if(el.dataset.a==='det'&&e.target.closest('details'))return;act(el.dataset.a,el)}});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='nama')S.nama=e.target.value;else if(f[0]==='m')S.m[f.slice(2)]=num(e.target.value);else if(f[0]==='b')S.b[+f.slice(2)]=num(e.target.value);
 if(f[0]==='m'||f[0]==='b'){const n=num(e.target.value),t=n?'Rp '+fmt(n):'';e.target.value=t;try{e.target.setSelectionRange(t.length,t.length)}catch(_){}}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;
 if(f[0]==='m'||f[0]==='b'){e.target.value=num(e.target.value)?'Rp '+fmt(num(e.target.value)):''}
 else if(f==='pop.r'){S.pop.r=+e.target.value;S.pop.n=Math.min(S.pop.n,ONE.has(relKey(S.pop.r,S.pop.g))?1:9);S.pop.sub={};if(!PGT.has(relKey(S.pop.r,S.pop.g))&&S.pop.st==='b')S.pop.st='h';render()}
 else if(f==='pop.ke')S.pop.ke=+e.target.value});
fetch('waris_faraidh.json').then(r=>r.json()).then(d=>{S.data=d;S.eng=new WarisJS.WarisLanjut(d);render()}).catch(()=>{document.getElementById('app').innerHTML='<p style="padding:16px">Data gagal dimuat. Buka lewat alamat http (bukan langsung dari berkas).</p>'});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
